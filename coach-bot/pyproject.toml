[project]
name = "lofoten-coach-bot"
version = "0.1.0"
description = "Slack coach for Lofoten Half Extreme 2027"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.21.0",
    "flask>=3.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Deploy from repo root: fly deploy --config coach-bot/fly.toml
app = "lofoten-coach"
primary_region = "ams"

[build]
  context = ".."
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[env]
  TZ = "Europe/Oslo"
  REPO_ROOT = "/app"
